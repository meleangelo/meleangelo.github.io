      - icon: envelope
        href: mailto:meleangelo@gmail.com
      - icon: github
        href: https://github.com/meleangelo
      - icon: linkedin
        href: https://www.linkedin.com/in/angelo-mele-b246182/
      - icon: twitter
        href: https://twitter.com/angelo_mele

